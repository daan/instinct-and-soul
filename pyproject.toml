[project]
name = "instinct-and-soul"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "esptool>=5.2.0",
    "mpremote>=1.27.0",
    "openai>=1.50.0",
    "rich>=14.3.3",
    "serial-device",
    "textual>=8.0.2",
    "websockets>=16.0",
    "numpy>=2.0",
    "soundfile>=0.12",
    "mido>=1.3.3",
    "google-genai>=1.0",
    "bvhio>=1.5.4",
]

[project.scripts]
spine = "instinct_and_soul.spine:main"
tune = "instinct_and_soul.tune:main"
flash = "instinct_and_soul.flash:main"
check-llm = "instinct_and_soul.check_llm:main"
bake-trace = "instinct_and_soul.tracelib.cli:main"
trace = "instinct_and_soul.tracelib.serve:main"
creature-sim = "instinct_and_soul.creature_sim.cli:main"
bake-audio = "instinct_and_soul.creature_sim.bake_audio:main"
bake-midi = "instinct_and_soul.creature_sim.bake_midi:main"
bake-video = "instinct_and_soul.creature_sim.bake_video:main"
sim-spine = "instinct_and_soul.sim_spine:main"
bake-mocap = "instinct_and_soul.mocaplib.extract:main"
skeleton = "instinct_and_soul.mocaplib.serve:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
serial-device = { git = "https://github.com/daan/serial_device" }
