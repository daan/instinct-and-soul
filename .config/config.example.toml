# Soul main config. Copy to config.toml and edit.

#
# Lookup order at startup:
#   1. ./.config/config.toml                     (project-local, this directory)
#   2. ~/.config/instinct-and-soul/config.toml   (user-global)
# `spine --llm <name>` / `flash creature <name> --wifi <name>` override the defaults below.

# use the wifi configuration found in .config/networks/home.toml
#wifi=home

# use the llm configuration found in .config/llm/openrouter.toml
#llm=openrouter

# or specify the wifi directly

[wifi]
mode       = "sta"		# or "ap" for accesspoint
ssid       = "network"	
pass       = "password"	
spine_host = "192.168.1.50" 


# or specify the llm directly

[llm]
api      = "anthropic"          # which API to speak: "anthropic" or "openai"
model    = "claude-sonnet-4-6"  # e.g. claude-opus-4-7, gpt-4o-mini, moonshot/kimi-k2
api_key  = "sk-ant-..."
# base_url = "..."              # optional, only for api = "openai"


