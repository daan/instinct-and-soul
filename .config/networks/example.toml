# networks/example.toml — template for a network profile.
#
# Copy this to networks/<name>.toml (e.g. networks/home.toml),
# fill in your values, then:
#   flash wifi home                       # flash wifi.py only
#   flash creatures/cores3 --wifi home    # flash both wifi.py and main.py
#
# Real profiles (networks/*.toml) are gitignored; this example is the
# one file in the directory that is checked in.

mode = "sta"  # "sta" (join existing WiFi) or "ap" (device hosts a network)

# Spine host is your *laptop's* IP. Only the one matching `mode` is required.

# Station mode: device joins your existing WiFi.
ssid       = "your-ssid"
pass       = "your-password"
spine_host = "10.0.0.2"

# Access-point mode: device creates this WiFi, laptop joins it.
# ssid       = "creature-ap"
# pass       = "changeme123"
# spine_host = "192.168.4.2"
# channel    = 6      # optional, defaults to 6 (mid-band, usually clear)

# Optional: override the spine WebSocket port (default 8765).
# spine_port = 8765
